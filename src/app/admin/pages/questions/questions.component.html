<app-admin-breadcrumb
    title="Suallar"
    [crumbs]="[{label: 'Sual'}, {label: 'Suallar'}]">
</app-admin-breadcrumb>

<mat-card class="questions-card mb-25 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="admin-card-header">
        <mat-card-title>
            <button class="add-btn" type="button" mat-flat-button color="primary" (click)="add()">
                <i class="material-symbols-outlined">add</i>
                Sual Əlavə Et
            </button>
        </mat-card-title>
        <mat-card-subtitle>
            <button mat-stroked-button type="button" (click)="openModal(searchTpl)">
                <span class="material-symbols-outlined">tune</span>
                Ətraflı Axtarış
            </button>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="audit-table-loading-shell" [attr.aria-busy]="isLoading">
        <div class="table-responsive" [class.audit-table-muted]="isLoading">
            <table mat-table [dataSource]="dataSource" matSort>
                <!-- Order -->
                <ng-container matColumnDef="order">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> SIRA </th>
                    <td mat-cell *matCellDef="let r"> {{ r.order ?? r.questionLine }} </td>
                </ng-container>

                <!-- Type -->
                <ng-container matColumnDef="type">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> SUAL TİPİ </th>
                    <td mat-cell *matCellDef="let r"> {{ typeLabel(r) }} </td>
                </ng-container>

                <!-- Question -->
                <ng-container matColumnDef="question">
                    <th mat-header-cell *matHeaderCellDef> SUAL </th>
                    <td mat-cell *matCellDef="let r">
                        <span class="question-text" [title]="r.questionText">{{ r.questionText }}</span>
                    </td>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> ƏMƏLİYYATLAR </th>
                    <td mat-cell *matCellDef="let r">
                        <div class="action-buttons">
                            <button type="button" class="action-btn view-btn" (click)="view(r)" matTooltip="Bax" matTooltipPosition="above">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                            <button type="button" class="action-btn edit-btn" (click)="edit(r)" matTooltip="Redaktə Et" matTooltipPosition="above">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button type="button" class="action-btn delete-btn" (click)="remove(r)" matTooltip="Sil" matTooltipPosition="above">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="4">
                        <div class="no-data-message">
                            <span class="material-symbols-outlined">search_off</span>
                            <p>Sual tapılmadı</p>
                            <small>Yeni sual əlavə etmək üçün yuxarıdakı düymədən istifadə edin</small>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

        <mat-paginator [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons [disabled]="isLoading"></mat-paginator>
        <app-audit-loading-overlay *ngIf="isLoading"
            title="Suallar yüklənir"
            hint="Sual siyahısı hazırlanır…"></app-audit-loading-overlay>
    </mat-card-content>
</mat-card>

<!-- Slide-over template -->
<ng-template #searchTpl>
    <div class="dialog-header">
        <h2 mat-dialog-title class="search-title">Axtarış</h2>
        <span class="material-symbols-outlined close-button" (click)="closeModal()">close</span>
    </div>
    <mat-dialog-content [formGroup]="searchForm">
        <div class="col-12">
            <div class="form-group">
                <label class="main-label">Kateqoriya</label>
                <mat-form-field>
                    <mat-label>Kateqoriya</mat-label>
                    <mat-select formControlName="categoryId">
                        <mat-option [value]="null">Hamısı</mat-option>
                        <mat-option *ngFor="let c of categories" [value]="c.id">{{ c.categoryName }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="main-label">Sual Tipi</label>
                <mat-form-field>
                    <mat-label>Sual Tipi</mat-label>
                    <mat-select formControlName="type">
                        <mat-option [value]="null">Hamısı</mat-option>
                        <mat-option *ngFor="let t of questionTypes" [value]="t.id">{{ t.label }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>

            <div class="form-group">
                <label class="main-label">Sual</label>
                <mat-form-field>
                    <mat-label>Sual mətni</mat-label>
                    <input matInput formControlName="question" placeholder="Sual mətni...">
                </mat-form-field>
            </div>

            <div class="searchButtons">
                <button mat-flat-button color="primary" (click)="onSearchSubmit()">
                    <span class="material-symbols-outlined">search</span>
                    Axtar
                </button>
                <button mat-stroked-button color="warn" (click)="resetForm()">
                    <span class="material-symbols-outlined">clear_all</span>
                    Formu Təmizlə
                </button>
            </div>
        </div>
    </mat-dialog-content>
</ng-template>
