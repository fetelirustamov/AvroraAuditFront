<app-admin-breadcrumb
    title="Səlahiyyət qrupları"
    [crumbs]="[{label: 'İstifadəçi İdarəetməsi'}, {label: 'Səlahiyyət qrupları'}]">
</app-admin-breadcrumb>

<!-- Permission Groups Table -->
<mat-card class="groups-card mb-25 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="admin-card-header">
        <mat-card-title>
            <button class="add-btn" type="button" mat-flat-button color="primary"
                [routerLink]="['/admin/permissions/permission-groups/add']">
                <i class="material-symbols-outlined">add</i>
                Əlavə et
            </button>
        </mat-card-title>
        <mat-card-subtitle>
            <div class="d-flex align-items-center justify-content-between w-100">
                <form class="search-box position-relative">
                    <label>
                        <i class="material-symbols-outlined">search</i>
                    </label>
                    <input type="text" class="input-search" placeholder="Axtarış sözü..."
                        (keyup)="applyFilter($event)">
                </form>
            </div>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="audit-table-loading-shell" [attr.aria-busy]="isLoading">

        <div class="table-responsive" [class.audit-table-muted]="isLoading">
            <table mat-table [dataSource]="dataSource" matSort>

                <!-- ID Column -->
                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Sıra </th>
                    <td mat-cell *matCellDef="let row"> {{row.id}} </td>
                </ng-container>

                <!-- Group Name Column -->
                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Qrup adı </th>
                    <td mat-cell *matCellDef="let row"> {{row.name}} </td>
                </ng-container>

                <!-- Actions Column -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Əməliyyatlar </th>
                    <td mat-cell *matCellDef="let row">
                        <div class="action-buttons">
                            <button type="button" class="action-btn view-btn" (click)="view(row)" matTooltip="Bax" matTooltipPosition="above">
                                <span class="material-symbols-outlined">visibility</span>
                            </button>
                            <button type="button" class="action-btn edit-btn" (click)="edit(row)" matTooltip="Redaktə et" matTooltipPosition="above">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button type="button" class="action-btn delete-btn" (click)="remove(row)" matTooltip="Sil" matTooltipPosition="above">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="3">
                        <div class="no-data-message">
                            <span class="material-symbols-outlined">search_off</span>
                            <p>Məlumat tapılmadı</p>
                            <small>Zəhmət olmasa axtarış kriteriyalarını dəyişin</small>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

        <mat-paginator [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons [disabled]="isLoading"></mat-paginator>
        <app-audit-loading-overlay *ngIf="isLoading"
            title="Qruplar yüklənir"
            hint="Səlahiyyət qrupları hazırlanır…"></app-audit-loading-overlay>
    </mat-card-content>
</mat-card>
