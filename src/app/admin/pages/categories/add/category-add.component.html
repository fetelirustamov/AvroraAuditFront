<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2 mat-dialog-title class="form-dialog-title">{{ isEdit ? 'Kateqoriyanı redaktə et' : 'Yeni kateqoriya' }}</h2>

    <mat-dialog-content>
        <div class="form-grid">
            <div class="form-field">
                <label class="g-field-label" id="category-section-field-label">Şöbə <span class="required-mark" aria-hidden="true">*</span></label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <mat-select formControlName="sectionId" aria-labelledby="category-section-field-label" required
                        placeholder="Şöbə seçin">
                        @for (s of sections; track s.id) {
                            <mat-option [value]="s.id">{{ s.sectionName }}</mat-option>
                        }
                    </mat-select>
                    <mat-error>Şöbəni seçin</mat-error>
                </mat-form-field>
                @if (!sections.length) {
                    <p class="field-note is-warning">
                        <span class="material-symbols-outlined" aria-hidden="true">warning</span>
                        Bu firmada şöbə yoxdur. Əvvəlcə «Şöbələr» tabında şöbə əlavə edin.
                    </p>
                }
            </div>

            <div class="form-field">
                <label class="g-field-label" for="category-name">Kateqoriya adı <span class="required-mark" aria-hidden="true">*</span></label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <input id="category-name" matInput formControlName="categoryName" required>
                    <mat-error>Kateqoriya adını yazın</mat-error>
                </mat-form-field>
            </div>

            <div class="form-field form-field-full">
                <label class="g-field-label" for="category-description">Açıqlama</label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <input id="category-description" matInput formControlName="categoryDescription" placeholder="Qısa açıqlama">
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="button" class="g-secondary-btn" (click)="cancel()">Ləğv et</button>
        <button type="submit" class="g-search-btn" [disabled]="isSaving">{{ isEdit ? 'Yadda saxla' : 'Əlavə et' }}</button>
    </mat-dialog-actions>
</form>
