<div class="modal-like">
    <mat-card>
        <mat-card-header>
            <div class="header-container">
                <mat-card-title>{{pageTitle}}</mat-card-title>
                <div class="top-actions">
                    <button mat-flat-button color="primary" type="submit" (click)="submit()">Təsdiqlə</button>
                    <button mat-stroked-button color="warn" type="button" (click)="cancel()">İmtina</button>
                </div>
            </div>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3 admin-input-design" novalidate>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">
                            Şöbə
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <mat-select formControlName="sectionId" required placeholder="Şöbə seçin">
                                <mat-option *ngFor="let s of sections" [value]="s.id">{{ s.sectionName }}</mat-option>
                            </mat-select>
                            <mat-error
                                *ngIf="form.get('sectionId')?.hasError('required') && form.get('sectionId')?.touched">
                                Şöbə tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">
                            Kateqoriya Adı
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="categoryName" required
                                placeholder="Kateqoriya adını daxil edin" />
                            <mat-error
                                *ngIf="form.get('categoryName')?.hasError('required') && form.get('categoryName')?.touched">
                                Kateqoriya adı tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">
                            Kateqoriya Açıqlaması
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="categoryDescription" placeholder="Qısa açıqlama" />
                        </mat-form-field>
                    </div>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
