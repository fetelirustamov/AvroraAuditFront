<app-admin-breadcrumb *ngIf="showBreadcrumb" title="Kateqoriyalar" [crumbs]="[{label: 'Sistem Parametrləri'}, {label: 'Kateqoriyalar'}]">
</app-admin-breadcrumb>

<mat-card class="categories-card mb-25 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="admin-card-header">
        <mat-card-title>
            <button class="add-btn" type="button" mat-flat-button color="primary" (click)="add()">
                <i class="material-symbols-outlined">add</i>
                Yeni Kateqoriya
            </button>
        </mat-card-title>
        <mat-card-subtitle>
            <div class="d-flex align-items-center justify-content-between w-100">

                <form class="search-box position-relative">
                    <label>
                        <i class="material-symbols-outlined">search</i>
                    </label>
                    <input type="text" class="input-search" placeholder="Axtarış sözü..." (keyup)="applyFilter($event)">
                </form>
            </div>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="audit-table-loading-shell" [attr.aria-busy]="isLoading">
        <div class="table-responsive" [class.audit-table-muted]="isLoading">
            <table mat-table [dataSource]="dataSource" matSort>
                <!-- Section -->
                <ng-container matColumnDef="section">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> SEKSİYA </th>
                    <td mat-cell *matCellDef="let r"> {{r.sectionName}} </td>
                </ng-container>

                <!-- Category Name -->
                <ng-container matColumnDef="categoryName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> KATEQORİYA ADI </th>
                    <td mat-cell *matCellDef="let r"> {{r.categoryName}} </td>
                </ng-container>

                <!-- Description -->
                <ng-container matColumnDef="description">
                    <th mat-header-cell *matHeaderCellDef> KATEQORİYA AÇIQLAMASI </th>
                    <td mat-cell *matCellDef="let r"> {{r.categoryDescription}} </td>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> ƏMƏLİYYATLAR </th>
                    <td mat-cell *matCellDef="let r">
                        <div class="action-buttons">
                            <button type="button" class="action-btn edit-btn" (click)="edit(r)" matTooltip="Redaktə Et"
                                matTooltipPosition="above">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button type="button" class="action-btn delete-btn" (click)="remove(r)" matTooltip="Sil"
                                matTooltipPosition="above">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="4">Məlumat tapılmadı</td>
                </tr>
            </table>
        </div>

        <mat-paginator [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons [disabled]="isLoading"></mat-paginator>
        <app-audit-loading-overlay *ngIf="isLoading"
            title="Kateqoriyalar yüklənir"
            hint="Kateqoriya siyahısı hazırlanır…"></app-audit-loading-overlay>
    </mat-card-content>
</mat-card>
