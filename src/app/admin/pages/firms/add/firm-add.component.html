<div class="modal-like">
    <mat-card>
        <mat-card-header>
            <div class="header-container">
                <mat-card-title>{{pageTitle}}</mat-card-title>
                <div class="top-actions">
                    <button mat-flat-button color="primary" type="submit" (click)="submit()" [disabled]="isSaving">Yadda saxla</button>
                    <button mat-stroked-button color="warn" type="button" (click)="cancel()">Ləğv et</button>
                </div>
            </div>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3 admin-input-design" novalidate>
                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">
                            Firma adı
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="name" required placeholder="Firma adını daxil edin" />
                            <mat-error *ngIf="form.get('name')?.hasError('required') && form.get('name')?.touched">
                                Firma adı tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">Açıqlama</label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="description" placeholder="Qısa açıqlama" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">Ünvan</label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="address" placeholder="Ünvan" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">Telefon</label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="phone" placeholder="+994 XX XXX XX XX" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">E-poçt</label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="email" type="email" placeholder="firma@nümunə.az" />
                            <mat-error *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
                                Düzgün formatda e-poçt daxil edin
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="form-group">
                        <label class="main-label">Vebsayt</label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="website" placeholder="https://" />
                        </mat-form-field>
                    </div>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
