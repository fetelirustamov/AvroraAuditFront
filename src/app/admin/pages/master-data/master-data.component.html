<app-page-header subtitle="Firmanın şöbələri, kateqoriyaları və mağazaları" />

<section class="g-filter-card">
    <div class="g-filter-grid">
        <div class="g-filter-field">
            <label class="g-field-label" id="master-firm-label">
                <span class="material-symbols-outlined" aria-hidden="true">business</span>Firma
            </label>
            <mat-form-field appearance="outline" class="g-modern-field">
                <mat-select aria-labelledby="master-firm-label" [value]="selectedFirmId"
                    (selectionChange)="onFirmChange($event.value)" [disabled]="isLoadingFirms"
                    placeholder="Firma seçin">
                    @for (f of firms; track f.id) {
                        <mat-option [value]="f.id">{{ f.name }}</mat-option>
                    }
                </mat-select>
            </mat-form-field>
        </div>
    </div>
</section>

@if (firmsError) {
    <div class="table-card">
        <app-list-state state="error" [errorMessage]="firmsError" (retry)="loadFirms()" />
    </div>
} @else if (selectedFirmId != null) {
    <mat-tab-group [selectedIndex]="tabIndex" (selectedIndexChange)="onTabChange($event)" mat-stretch-tabs="false"
        animationDuration="0ms">
        <mat-tab label="Şöbələr">
            <ng-template matTabContent>
                <app-sections [firmId]="selectedFirmId" />
            </ng-template>
        </mat-tab>
        <mat-tab label="Kateqoriyalar">
            <ng-template matTabContent>
                <app-categories [firmId]="selectedFirmId" />
            </ng-template>
        </mat-tab>
        <mat-tab label="Mağazalar">
            <ng-template matTabContent>
                <app-locations [firmId]="selectedFirmId" />
            </ng-template>
        </mat-tab>
    </mat-tab-group>
} @else if (!isLoadingFirms) {
    <div class="table-card">
        <app-list-state state="idle"
            [message]="firms.length ? 'Davam etmək üçün firma seçin' : 'Hələ firma yoxdur. Əvvəlcə «Firmalar» səhifəsində firma əlavə edin.'" />
    </div>
}
