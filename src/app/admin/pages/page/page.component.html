<app-page-header subtitle="Menyu səhifələri və onların icazə açarları">
    <button headerActions type="button" class="g-search-btn" (click)="add()">
        <span class="material-symbols-outlined" aria-hidden="true">add</span>
        Yeni səhifə
    </button>
</app-page-header>

<section class="g-filter-card">
    <div class="g-filter-grid">
        <div class="g-filter-field-wide">
            <label class="g-field-label" for="page-search">
                <span class="material-symbols-outlined" aria-hidden="true">search</span>Axtarış
            </label>
            <mat-form-field appearance="outline" class="g-modern-field">
                <input id="page-search" matInput type="search" [formControl]="searchControl"
                    placeholder="Səhifə adı və ya açar">
            </mat-form-field>
        </div>
    </div>
</section>

<div class="table-card" [attr.aria-busy]="isLoading">
    @if (isLoading) {
        <mat-progress-bar class="list-progress" mode="indeterminate" />
    }

    @if (loadError) {
        <app-list-state state="error" [errorMessage]="loadError" (retry)="load()" />
    }

    <div class="table-sticky" [hidden]="!!loadError">
        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Səhifə adı</th>
                <td mat-cell *matCellDef="let row">{{ row.name }}</td>
            </ng-container>

            <ng-container matColumnDef="key">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Açar</th>
                <td mat-cell *matCellDef="let row"><span class="mono">{{ row.key }}</span></td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let row">
                    <span class="status-chip" [class.is-success]="row.status === 1" [class.is-neutral]="row.status !== 1">
                        {{ row.status === 1 ? 'Aktiv' : 'Passiv' }}
                    </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Əməliyyatlar</th>
                <td mat-cell *matCellDef="let row">
                    <div class="action-buttons">
                        <button type="button" class="action-btn" (click)="edit(row)"
                            matTooltip="Redaktə et" aria-label="Redaktə et">
                            <span class="material-symbols-outlined" aria-hidden="true">edit</span>
                        </button>
                        <button type="button" class="action-btn delete-btn" (click)="remove(row)"
                            matTooltip="Sil" aria-label="Sil">
                            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
                        </button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    @if (loaded) {
                        <app-list-state state="empty"
                            [message]="dataSource.filter ? 'Axtarışa uyğun səhifə tapılmadı' : 'Hələ səhifə əlavə edilməyib'" />
                    }
                </td>
            </tr>
        </table>
    </div>

    <mat-paginator [hidden]="!!loadError" [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons
        aria-label="Səhifələr siyahısının səhifəsini seç" (page)="urlState.writePage($event)"></mat-paginator>
</div>
