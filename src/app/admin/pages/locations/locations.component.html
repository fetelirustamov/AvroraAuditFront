<app-admin-breadcrumb
    title="Mağazalar / Məkanlar"
    [crumbs]="[{label: 'Parametrlər'}, {label: 'Mağazalar'}]">
</app-admin-breadcrumb>

<mat-card class="locations-card mb-25 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="admin-card-header">
        <mat-card-title>
            <button class="add-btn" type="button" mat-flat-button color="primary" (click)="add()">
                <i class="material-symbols-outlined">add</i>
                Yeni Mağaza
            </button>
        </mat-card-title>
        <mat-card-subtitle>
            <button mat-stroked-button type="button" (click)="openModal(searchTpl)">
                <span class="material-symbols-outlined">tune</span>
                Ətraflı Axtarış
            </button>
        </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content class="audit-table-loading-shell" [attr.aria-busy]="isLoading">
        <div class="table-responsive" [class.audit-table-muted]="isLoading">
            <table mat-table [dataSource]="dataSource" matSort>
                <!-- Firm -->
                <ng-container matColumnDef="firmName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> FİRMA </th>
                    <td mat-cell *matCellDef="let r"> {{r.firmName}} </td>
                </ng-container>

                <!-- Code -->
                <ng-container matColumnDef="locationCode">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> KOD </th>
                    <td mat-cell *matCellDef="let r"> {{r.locationCode || '—'}} </td>
                </ng-container>

                <!-- Name -->
                <ng-container matColumnDef="locationName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> AD </th>
                    <td mat-cell *matCellDef="let r"> {{r.locationName}} </td>
                </ng-container>

                <!-- Phone -->
                <ng-container matColumnDef="contactNumber">
                    <th mat-header-cell *matHeaderCellDef> ƏLAQƏ </th>
                    <td mat-cell *matCellDef="let r"> {{r.contactNumber || '—'}} </td>
                </ng-container>

                <!-- Lat -->
                <ng-container matColumnDef="latitude">
                    <th mat-header-cell *matHeaderCellDef> LAT </th>
                    <td mat-cell *matCellDef="let r"> {{r.latitude || '—'}} </td>
                </ng-container>

                <!-- Lng -->
                <ng-container matColumnDef="longitude">
                    <th mat-header-cell *matHeaderCellDef> LNG </th>
                    <td mat-cell *matCellDef="let r"> {{r.longitude || '—'}} </td>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> ƏMƏLİYYATLAR </th>
                    <td mat-cell *matCellDef="let r">
                        <div class="action-buttons">
                            <button type="button" class="action-btn edit-btn" (click)="edit(r)" matTooltip="Redaktə Et" matTooltipPosition="above">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button type="button" class="action-btn delete-btn" (click)="remove(r)" matTooltip="Sil" matTooltipPosition="above">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="7">Məlumat tapılmadı</td>
                </tr>
            </table>
        </div>

        <mat-paginator [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons [disabled]="isLoading"></mat-paginator>
        <app-audit-loading-overlay *ngIf="isLoading"
            title="Mağazalar yüklənir"
            hint="Məkan siyahısı hazırlanır…"></app-audit-loading-overlay>
    </mat-card-content>
</mat-card>

<!-- Slide-over template -->
<ng-template #searchTpl>
    <div class="dialog-header">
        <h2 mat-dialog-title class="search-title">Axtarış</h2>
        <!-- <button mat-icon-button class=""> -->
        <!-- <mat-icon>close</mat-icon> -->
        <span class="material-symbols-outlined close-button" (click)="closeModal()">close</span>
        <!-- </button> -->
    </div>
    <mat-dialog-content [formGroup]="searchForm">

        <div class="col-12">
            <div class="form-group">
                <label class="main-label">Müəsisələr</label>
                <mat-form-field>
                    <mat-label>Müəsisə</mat-label>
                    <mat-select formControlName="firmId" (selectionChange)="onFirmChange($event.value)">
                        <mat-option *ngFor="let firm of firms" [value]="firm.id">{{ firm.name }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="form-group">
                <label class="main-label">Ərazi</label>
                <mat-form-field>
                    <mat-label>Ərazi</mat-label>
                    <mat-select formControlName="regionId" [disabled]="!regions.length">
                        <mat-option *ngFor="let region of regions" [value]="region.id">
                            {{ region.regionName || region.name }}
                        </mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <label class="main-label d-block fw-medium ">
                        Ərazi
                    </label>
                    <mat-form-field>
                        <mat-label>
                            Ərazi adı
                        </mat-label>
                        <input matInput formControlName="locationCode">
                    </mat-form-field>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <label class="main-label d-block fw-medium ">
                        Kod
                    </label>
                    <mat-form-field>
                        <mat-label>
                            Ərazi Kodu
                        </mat-label>
                        <input matInput formControlName="locationCode">
                    </mat-form-field>
                </div>
            </div>

            <div class="col-12 searchButtons">
                <button mat-flat-button color="primary" class="mr-20" (click)="onSearchSubmit()">
                    <span class="material-symbols-outlined">search</span>
                    Axtar
                </button>
                <button mat-stroked-button color="warn" (click)="resetForm()">
                    <span class="material-symbols-outlined">clear_all</span>
                    Formu Təmizlə
                </button>
            </div>

        </div>

    </mat-dialog-content>
</ng-template>
