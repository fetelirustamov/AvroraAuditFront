<div class="modal-like">
    <mat-card>
        <mat-card-header>
            <div class="header-container">
                <mat-card-title>{{ data?.mode === 'edit' ? 'Mağaza Redaktə Et' : 'Yeni Mağaza' }}</mat-card-title>
                <div class="top-actions">
                    <button mat-flat-button color="primary" type="button" (click)="submit()">
                        {{ data?.mode === 'edit' ? 'Yadda Saxla' : 'Təsdiqlə' }}
                    </button>
                    <button mat-stroked-button color="warn" type="button" (click)="cancel()">İmtina</button>
                </div>
            </div>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" class="row g-3 admin-input-design" novalidate>
                <div class="col-md-4 col-sm-6 col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Firma
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <mat-select formControlName="firmId" required placeholder="Firma" (selectionChange)="onFirmChange($event.value)">
                                <mat-option *ngIf="firms.length === 0" disabled>Firmalar yüklənir...</mat-option>
                                <mat-option *ngFor="let f of firms" [value]="f.id">{{ f.name }}</mat-option>
                            </mat-select>
                            <mat-error *ngIf="form.get('firmId')?.hasError('required') && form.get('firmId')?.touched">
                                Firma tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Region
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <mat-select formControlName="regionId" required placeholder="Region" [disabled]="!regions.length" [compareWith]="compareNumericIds">
                                <mat-option *ngIf="form.get('firmId')?.value && regions.length === 0" disabled>Regionlar yüklənir...</mat-option>
                                <mat-option *ngFor="let r of regions" [value]="r.id">{{ r.regionName || r.name }}</mat-option>
                            </mat-select>
                            <mat-error *ngIf="form.get('regionId')?.hasError('required') && form.get('regionId')?.touched">
                                Region tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12" *ngIf="!isEditMode">
                    <div class="form-group">
                        <label class="main-label">Şöbələr</label>
                        <mat-form-field class="w-100">
                            <mat-select [(ngModel)]="selectedSectionIds" [ngModelOptions]="{standalone: true}" multiple placeholder="Şöbə seçin" [disabled]="!sections.length">
                                <mat-option *ngIf="form.get('firmId')?.value && sections.length === 0" disabled>Şöbələr yüklənir...</mat-option>
                                <mat-option *ngFor="let s of sections" [value]="s.id">{{ s.sectionName }}</mat-option>
                            </mat-select>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Məkan Adı
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="locationName" required placeholder="Mağaza / məkan adı" />
                            <mat-error
                                *ngIf="form.get('locationName')?.hasError('required') && form.get('locationName')?.touched">
                                Ad tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Məkan Kodu
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="locationCode" placeholder="Kod" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-8 col-sm-12 col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Ünvan
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="locationAddress" placeholder="Ünvanı yazın" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-4 col-sm-6 col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Əlaqə Nömrəsi
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="contactNumber" placeholder="050 xxx xx xx" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-12">
                    <app-map-picker [lat]="initialLat" [lng]="initialLng" (pick)="onPickCoord($event)"></app-map-picker>
                </div>

                <div class="col-md-6 col-sm-6 col-12 after-map">
                    <div class="form-group">
                        <label class="main-label">
                            Latitude
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="latitude" placeholder="Enlik (auto)" />
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-6 col-sm-6 col-12 after-map">
                    <div class="form-group">
                        <label class="main-label">
                            Longitude
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="longitude" placeholder="Uzunluq (auto)" />
                        </mat-form-field>
                    </div>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
