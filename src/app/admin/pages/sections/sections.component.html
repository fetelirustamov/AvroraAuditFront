<app-admin-breadcrumb *ngIf="showBreadcrumb" title="Şöbələr" [crumbs]="[{label: 'Sistem parametrləri'}, {label: 'Şöbələr'}]">
</app-admin-breadcrumb>

<mat-card class="sections-card mb-25 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-header class="admin-card-header">
        <mat-card-title class="w-100">
            <div class="sections-toolbar">
                <button class="add-btn" type="button" mat-flat-button color="primary" (click)="add()">
                    <i class="material-symbols-outlined">add</i>
                    Yeni şöbə
                </button>

                <mat-form-field class="firm-filter" *ngIf="firmId == null">
                    <mat-label>Firma</mat-label>
                    <mat-select [(ngModel)]="selectedFirmId" (selectionChange)="onFirmChange()">
                        <mat-option [value]="null">Bütün firmalar</mat-option>
                        <mat-option *ngFor="let f of firms" [value]="f.id">{{ f.name }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
        </mat-card-title>
    </mat-card-header>

    <mat-card-content class="audit-table-loading-shell" [attr.aria-busy]="isLoading">
        <div class="table-responsive" [class.audit-table-muted]="isLoading">
            <table mat-table [dataSource]="dataSource" matSort>
                <!-- Firm Name -->
                <!-- <ng-container matColumnDef="firmName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> FİRMA </th>
                    <td mat-cell *matCellDef="let r"> {{r.firmName || '-'}} </td>
                </ng-container> -->

                <!-- Section Name -->
                <ng-container matColumnDef="sectionName">
                    <th mat-header-cell *matHeaderCellDef mat-sort-header> Şöbə adı </th>
                    <td mat-cell *matCellDef="let r"> {{r.sectionName}} </td>
                </ng-container>

                <!-- Actions -->
                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Əməliyyatlar </th>
                    <td mat-cell *matCellDef="let r">
                        <div class="action-buttons">
                            <button type="button" class="action-btn edit-btn" (click)="edit(r)" matTooltip="Redaktə et"
                                matTooltipPosition="above">
                                <span class="material-symbols-outlined">edit</span>
                            </button>
                            <button type="button" class="action-btn delete-btn" (click)="remove(r)" matTooltip="Sil"
                                matTooltipPosition="above">
                                <span class="material-symbols-outlined">delete</span>
                            </button>
                        </div>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                <tr class="mat-row" *matNoDataRow>
                    <td class="mat-cell text-center" colspan="2">
                        <div class="no-data-message">
                            <span class="material-symbols-outlined">search_off</span>
                            <p>Şöbə tapılmadı</p>
                            <small>Yeni şöbə əlavə etmək üçün yuxarıdakı düymədən istifadə edin</small>
                        </div>
                    </td>
                </tr>
            </table>
        </div>

        <mat-paginator [pageSizeOptions]="[10,25,50,100]" showFirstLastButtons [disabled]="isLoading"></mat-paginator>
        <app-audit-loading-overlay *ngIf="isLoading"
            title="Şöbələr yüklənir"
            hint="Şöbə siyahısı hazırlanır…"></app-audit-loading-overlay>
    </mat-card-content>
</mat-card>
