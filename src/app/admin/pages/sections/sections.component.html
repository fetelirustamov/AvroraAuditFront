<section class="g-filter-card">
    <div class="g-filter-grid">
        <div class="g-filter-field-wide">
            <label class="g-field-label" for="section-search">
                <span class="material-symbols-outlined" aria-hidden="true">search</span>Axtarış
            </label>
            <mat-form-field appearance="outline" class="g-modern-field">
                <input id="section-search" matInput type="search" [formControl]="searchControl" placeholder="Şöbə adı">
            </mat-form-field>
        </div>
        <div class="g-filter-actions">
            <button type="button" class="g-search-btn" (click)="add()">
                <span class="material-symbols-outlined" aria-hidden="true">add</span>
                Yeni şöbə
            </button>
        </div>
    </div>
</section>

<div class="table-card" [attr.aria-busy]="isLoading">
    @if (isLoading) {
        <mat-progress-bar class="list-progress" mode="indeterminate" />
    }

    @if (loadError) {
        <app-list-state state="error" [errorMessage]="loadError" (retry)="load()" />
    }

    <div class="table-sticky" [hidden]="!!loadError">
        <table mat-table [dataSource]="dataSource" matSort>
            <ng-container matColumnDef="sectionName">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Şöbə adı</th>
                <td mat-cell *matCellDef="let r">{{ r.sectionName }}</td>
            </ng-container>

            <ng-container matColumnDef="sectionDescription">
                <th mat-header-cell *matHeaderCellDef>Açıqlama</th>
                <td mat-cell *matCellDef="let r"><span class="clamp-2">{{ r.sectionDescription || '—' }}</span></td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Əməliyyatlar</th>
                <td mat-cell *matCellDef="let r">
                    <div class="action-buttons">
                        <button type="button" class="action-btn" (click)="edit(r)"
                            matTooltip="Redaktə et" aria-label="Redaktə et">
                            <span class="material-symbols-outlined" aria-hidden="true">edit</span>
                        </button>
                        <button type="button" class="action-btn delete-btn" (click)="remove(r)"
                            matTooltip="Sil" aria-label="Sil">
                            <span class="material-symbols-outlined" aria-hidden="true">delete</span>
                        </button>
                    </div>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" [attr.colspan]="displayedColumns.length">
                    @if (loaded) {
                        <app-list-state state="empty"
                            [message]="searchControl.value.trim() ? 'Axtarışa uyğun şöbə tapılmadı' : 'Bu firmada hələ şöbə yoxdur'" />
                    }
                </td>
            </tr>
        </table>
    </div>

    <mat-paginator [hidden]="!!loadError" [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons
        aria-label="Şöbələr siyahısının səhifəsini seç" (page)="urlState.writePage($event)"></mat-paginator>
</div>
