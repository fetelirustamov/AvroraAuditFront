<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h2 mat-dialog-title class="form-dialog-title">{{ isEdit ? 'Şöbəni redaktə et' : 'Yeni şöbə' }}</h2>

    <mat-dialog-content>
        <div class="form-grid">
            <div class="form-field">
                <label class="g-field-label" id="section-firm-label">Firma <span class="required-mark" aria-hidden="true">*</span></label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <mat-select formControlName="firmId" aria-labelledby="section-firm-label" required placeholder="Firma seçin">
                        @for (f of firms; track f.id) {
                            <mat-option [value]="f.id">{{ f.name }}</mat-option>
                        }
                    </mat-select>
                    <mat-error>Firmanı seçin</mat-error>
                </mat-form-field>
            </div>

            <div class="form-field">
                <label class="g-field-label" for="section-name">Şöbə adı <span class="required-mark" aria-hidden="true">*</span></label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <input id="section-name" matInput formControlName="sectionName" required>
                    <mat-error>Şöbə adını yazın</mat-error>
                </mat-form-field>
            </div>

            <div class="form-field form-field-full">
                <label class="g-field-label" for="section-description">Açıqlama</label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <textarea id="section-description" matInput formControlName="sectionDescription" rows="3"
                        placeholder="Qısa açıqlama"></textarea>
                </mat-form-field>
            </div>
        </div>
    </mat-dialog-content>

    <mat-dialog-actions align="end">
        <button type="button" class="g-secondary-btn" (click)="cancel()">Ləğv et</button>
        <button type="submit" class="g-search-btn" [disabled]="isSaving">{{ isEdit ? 'Yadda saxla' : 'Əlavə et' }}</button>
    </mat-dialog-actions>
</form>
