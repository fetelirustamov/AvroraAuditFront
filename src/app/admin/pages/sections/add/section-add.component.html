<div class="modal-like">
    <mat-card>
        <mat-card-header>
            <div class="header-container">
                <mat-card-title>{{pageTitle}}</mat-card-title>
                <div class="top-actions">
                    <button mat-flat-button color="primary" type="submit" (click)="submit()" [disabled]="isSaving">Yadda saxla</button>
                    <button mat-stroked-button color="warn" type="button" (click)="cancel()">Ləğv et</button>
                </div>
            </div>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3 admin-input-design" novalidate>
                <div class="col-md-6">
                    <div class="form-group">
                        <label class="main-label">
                            Firma
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <mat-select formControlName="firmId" required placeholder="Firma">
                                <mat-option *ngFor="let f of firms" [value]="f.id">{{ f.name }}</mat-option>
                            </mat-select>
                            <mat-error *ngIf="form.get('firmId')?.hasError('required') && form.get('firmId')?.touched">
                                Firma seçilməlidir
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="form-group">
                        <label class="main-label">
                            Şöbə adı
                            <span class="text-danger">*</span>
                        </label>
                        <mat-form-field class="w-100">
                            <input matInput formControlName="sectionName" required
                                placeholder="Şöbə adını daxil edin" />
                            <mat-error
                                *ngIf="form.get('sectionName')?.hasError('required') && form.get('sectionName')?.touched">
                                Şöbə adı tələb olunur
                            </mat-error>
                        </mat-form-field>
                    </div>
                </div>

                <div class="col-12">
                    <div class="form-group">
                        <label class="main-label">
                            Şöbə açıqlaması
                        </label>
                        <mat-form-field class="w-100">
                            <textarea matInput formControlName="sectionDescription" rows="3"
                                placeholder="Qısa açıqlama"></textarea>
                        </mat-form-field>
                    </div>
                </div>
            </form>
        </mat-card-content>
    </mat-card>
</div>
