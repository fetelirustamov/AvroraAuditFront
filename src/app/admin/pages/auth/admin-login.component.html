<div class="admin-login-container">
    <div class="admin-login-card">
        <div class="login-header text-center mb-25">
            <div class="brand mb-20">
                <div class="brand-mark">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
            <h2 class="login-title mb-10">Giriş</h2>
            <p class="login-subtitle">Hesabınıza daxil olun</p>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="login-form" autocomplete="on">
            <!-- Email Field -->
            <div class="form-field-group">
                <label for="admin-email" class="field-label">
                    E-poçt ünvanı
                    <span class="required-indicator">*</span>
                </label>
                <mat-form-field appearance="fill" class="custom-form-field">
                    <mat-icon matPrefix class="field-icon">email</mat-icon>
                    <input
                        matInput
                        id="admin-email"
                        formControlName="email"
                        type="email"
                        autocomplete="username"
                        required
                        placeholder="ad.soyad@sirket.az"
                        aria-describedby="email-help"
                    />
                    <mat-hint id="email-help">Sistemə daxil olmaq üçün istifadə etdiyiniz e-poçt ünvanı.</mat-hint>
                    <mat-error *ngIf="form.get('email')?.hasError('required') && form.get('email')?.touched">
                        E-poçt ünvanı məcburidir.
                    </mat-error>
                    <mat-error *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
                        Düzgün formatda e-poçt ünvanı daxil edin.
                    </mat-error>
                </mat-form-field>
            </div>

            <!-- Password Field -->
            <div class="form-field-group">
                <label for="admin-password" class="field-label">
                    Parol
                    <span class="required-indicator">*</span>
                </label>
                <mat-form-field appearance="fill" class="custom-form-field">
                    <mat-icon matPrefix class="field-icon">lock</mat-icon>
                    <input
                        matInput
                        id="admin-password"
                        [type]="hide ? 'password' : 'text'"
                        formControlName="password"
                        autocomplete="current-password"
                        required
                        minlength="5"
                        placeholder="Parolunuzu daxil edin"
                    />
                    <button
                        mat-icon-button
                        matSuffix
                        type="button"
                        (click)="hide = !hide"
                        [attr.aria-label]="hide ? 'Parolu göstər' : 'Parolu gizlət'"
                        [attr.aria-pressed]="!hide"
                        class="toggle-password-btn"
                    >
                        <mat-icon class="toggle-password-icon">
                            {{ hide ? 'visibility_off' : 'visibility' }}
                        </mat-icon>
                    </button>

                    <mat-error *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched">
                        Parol məcburidir.
                    </mat-error>
                    <mat-error *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched">
                        Parol ən azı 5 simvoldan ibarət olmalıdır.
                    </mat-error>
                </mat-form-field>
            </div>

            <button
                class="login-btn w-100 mb-15"
                mat-flat-button
                color="primary"
                type="submit"
                [disabled]="loading || form.invalid"
            >
                <span *ngIf="!loading">Giriş et</span>
                <span *ngIf="loading">Gözləyin...</span>
            </button>

            <div class="error-message" *ngIf="error" role="alert" aria-live="polite">
                <mat-icon class="ms-outlined">error</mat-icon>
                <span>{{ error }}</span>
            </div>
        </form>
    </div>
</div>
