<div class="header-area bg-white border-bottom-radius transition"
    [ngClass]="{'active': isSidebarToggled, 'sticky': isSticky}">
    <div class="d-md-flex align-items-center justify-content-between">
        <div class="header-left-side d-flex align-items-center">
            <div class="burger-menu transition position-relative lh-1" [ngClass]="{'active': isSidebarToggled}"
                (click)="toggle()">
                <i class="material-symbols-outlined">
                    menu
                </i>
            </div>
            <form class="search-box position-relative" (ngSubmit)="onSearchSubmit($event)" autocomplete="off">
                <input type="text" class="input-search" placeholder="Admin menyusunda axtar..."
                    [value]="searchQuery"
                    (input)="onSearchInput($event)"
                    (focus)="onSearchFocus($event)"
                    (blur)="closeSearchResults()">
                <button type="submit" class="bg-transparent p-0 border-none transition">
                    <i class="material-symbols-outlined">
                        search
                    </i>
                </button>
                <ul class="admin-search-results" *ngIf="showResults && searchResults.length">
                    <li *ngFor="let item of searchResults">
                        <a (mousedown)="goToResult(item)">{{ item.label }}</a>
                    </li>
                </ul>
                <div class="admin-search-empty" *ngIf="showResults && searchQuery && !searchResults.length">
                    Nəticə tapılmadı
                </div>
            </form>

        </div>
        <ul class="header-right-side d-flex align-items-center m-0 p-0 list-unstyled">

            <li>
                <button mat-button [matMenuTriggerFor]="profileMenu" class="profile-menu-btn">
                    <img [src]="profileAvatarDataUrl" class="rounded-circle" alt="profil şəkli">
                    <span class="fw-semibold text-black">
                        {{ profileTriggerLabel }}
                    </span>
                </button>
                <mat-menu class="profile-menu-dropdown" #profileMenu="matMenu" xPosition="before">
                    <div class="admin d-flex align-items-center">
                        <img [src]="profileAvatarDataUrl" class="rounded-circle" alt="profil şəkli">
                        <div>
                            <span class="d-block text-black fw-medium">
                                {{ profileFullName }}
                            </span>
                            <span class="d-block" *ngIf="profileRoleLine">
                                {{ profileRoleLine }}
                            </span>
                        </div>
                    </div>
                    <div class="border-top"></div>
                    <ul class="list p-0 mt-0 mb-0 list-unstyled">
                        <li>
                            <a (click)="logout()" class="d-block position-relative">
                                <i class="material-symbols-outlined">
                                    logout
                                </i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </mat-menu>
            </li>
        </ul>
    </div>
</div>
