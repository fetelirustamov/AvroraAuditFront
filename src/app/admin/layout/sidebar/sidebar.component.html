<div class="sidebar-area bg-white transition active" [ngClass]="{'active': isSidebarToggled}"
    [class.card-borderd]="themeService.isCardBordered()" [class.dark-sidebar]="themeService.isSidebarDark()"
    [class.hide-sidebar]="themeService.isHideSidebar()" [class.component-dark-theme]="themeService.isDark()"
    [class.right-sidebar]="themeService.isRightSidebar()" [class.component-rtl-enabled]="themeService.isRTLEnabled()"
    [class.card-with-box-shadow]="themeService.isCardWithBoxShadow()">
    <div class="logo bg-white">
        <a routerLink="/admin/dashboard" class="d-flex align-items-center position-relative">
            <img src="images/logo-icon.svg" class="transition position-relative" alt="logo-icon">
            <span class="fw-bold text-black lh-1 transition position-relative">
                Audit
            </span>
        </a>
    </div>
    <div (click)="toggle()" class="burger-menu transition" [ngClass]="{'active': isSidebarToggled}">
        <span class="top-bar transition d-block bg-black"></span>
        <span class="middle-bar transition d-block bg-black"></span>
        <span class="bottom-bar transition d-block bg-black"></span>
    </div>
    <ng-scrollbar visibility="hover">
        <div class="sidebar-inner">
            <div class="sidebar-menu">
                <mat-accordion>
                    <span class="sub-title d-block fw-medium text-uppercase">
                        MAIN
                    </span>
                    <a routerLink="/admin/dashboard" class="sidebar-menu-link" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">
                        <i class="material-symbols-outlined">
                            dashboard
                        </i>
                        <span class="title">
                            Dashboard
                        </span>
                    </a>
                    <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
                        <mat-expansion-panel-header>
                            <mat-panel-title>
                                <span class="material-symbols-outlined">
                                    inbox_text_person
                                </span>
                                <span class="title">
                                    Yetkiləndirmə
                                </span>
                            </mat-panel-title>
                        </mat-expansion-panel-header>
                        <ul class="sidebar-sub-menu">
                            <li class="sidemenu-item">
                                <a routerLink="/admin/permissions/structure" routerLinkActive="active"
                                    [routerLinkActiveOptions]="{exact: true}" class="sidemenu-link">
                                    Ərazi Bağlantıları
                                </a>
                            </li>
                            <li class="sidemenu-item">
                                <a routerLink="/admin/permissions/user-permission" routerLinkActive="active"
                                    [routerLinkActiveOptions]="{exact: true}" class="sidemenu-link">
                                    İstifadəçi İcazələri
                                </a>
                            </li>
                            <li class="sidemenu-item">
                                <a routerLink="/admin/permissions/permission-groups" routerLinkActive="active"
                                    [routerLinkActiveOptions]="{exact: true}" class="sidemenu-link">
                                    Səlahiyyət qrupları
                                </a>
                            </li>
                            <li class="sidemenu-item">
                                <a routerLink="/admin/pages" routerLinkActive="active"
                                    [routerLinkActiveOptions]="{exact: true}" class="sidemenu-link">
                                    Səhifələr
                                </a>
                            </li>
                        </ul>
                    </mat-expansion-panel>
                    <a routerLink="/admin/questions" class="sidebar-menu-link" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">
                        <i class="material-symbols-outlined">help</i>
                        <span class="title">Suallar</span>
                    </a>
                    <a routerLink="/admin/master-data" class="sidebar-menu-link" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">
                        <i class="material-symbols-outlined">category</i>
                        <span class="title">Şöbələr və Kateqoriyalar</span>
                    </a>
                    <a routerLink="/admin/locations" class="sidebar-menu-link" routerLinkActive="active"
                        [routerLinkActiveOptions]="{exact: true}">
                        <i class="material-symbols-outlined">store</i>
                        <span class="title">Mağazalar</span>
                    </a>
                </mat-accordion>
            </div>
        </div>
    </ng-scrollbar>
</div>
