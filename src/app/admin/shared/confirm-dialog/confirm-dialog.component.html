<div class="confirm-dialog">
  <h2 class="confirm-title">
    <span class="material-symbols-outlined icon">warning</span>
    {{ data.title || 'Əminsiniz?' }}
  </h2>

  <p class="confirm-message">
    {{ data.message }}
  </p>

  <div class="confirm-actions">
    <button mat-stroked-button color="warn" (click)="onCancel()">
      {{ data.cancelText || 'Ləğv et' }}
    </button>
    <button mat-flat-button color="primary" (click)="onConfirm()">
      {{ data.confirmText || 'Bəli, sil' }}
    </button>
  </div>
</div>
