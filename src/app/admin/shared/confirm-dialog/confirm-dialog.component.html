<div class="confirm-dialog">
  <h2 class="confirm-title">
    <span class="material-symbols-outlined icon">warning</span>
    {{ data.title || 'Əminsiniz?' }}
  </h2>

  <p class="confirm-message">
    {{ data.message }}
  </p>

  <div class="confirm-actions">
    <button mat-stroked-button type="button" cdkFocusInitial (click)="onCancel()">
      {{ data.cancelText || 'Ləğv et' }}
    </button>
    <button mat-flat-button type="button" [color]="data.tone === 'danger' ? 'warn' : 'primary'" (click)="onConfirm()">
      {{ data.confirmText || 'Təsdiqlə' }}
    </button>
  </div>
</div>
