<div class="breadcrumb-card mb-25 d-md-flex align-items-center justify-content-between">
    <h5 class="mb-0">
        <i *ngIf="icon" class="material-symbols-outlined me-2">{{ icon }}</i>
        {{ title }}
    </h5>
    <ol class="breadcrumb list-unstyled mt-0 mb-0 p-0">
        <li class="breadcrumb-item d-inline-block position-relative">
            <a routerLink="/admin/dashboard" class="d-inline-block position-relative">
                <i class="material-symbols-outlined">home</i>
                Əsas səhifə
            </a>
        </li>
        <li *ngFor="let crumb of crumbs"
            class="breadcrumb-item d-inline-block position-relative">
            <a *ngIf="crumb.link; else plainLabel"
               [routerLink]="crumb.link"
               class="d-inline-block position-relative">{{ crumb.label }}</a>
            <ng-template #plainLabel>{{ crumb.label }}</ng-template>
        </li>
    </ol>
</div>
