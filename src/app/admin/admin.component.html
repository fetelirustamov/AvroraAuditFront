<div class="admin-container" [class.card-borderd]="themeService.isCardBordered()"
    [class.card-with-box-shadow]="themeService.isCardWithBoxShadow()"
    [class.card-without-border-radius]="themeService.isCardWithoutBorderRadius()">

    <!-- Sidebar -->
    <app-sidebar />

    <!-- Main Content -->
    <div [class.right-sidebar]="themeService.isRightSidebar()" [class.hide-sidebar]="themeService.isHideSidebar()"
        class="main-content transition d-flex flex-column admin-input-design" [ngClass]="{'active': isSidebarToggled}">

        <!-- Header -->
        <app-header />

        <!-- Main Content Area -->
        <div class="content-wrapper">
            <!-- Router Outlet -->
            <router-outlet />
        </div>

        <div class="flex-grow-1"></div>

        <!-- Footer -->
        <app-footer />
    </div>

    <!-- Customizer Settings -->
    <app-customizer-settings />
</div>
