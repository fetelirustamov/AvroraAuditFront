<header class="header-area" [class.active]="isSidebarToggled">
    <div class="header-start">
        <button type="button" class="header-icon-btn" (click)="toggle()" aria-label="Menyu">
            <span class="material-symbols-outlined" aria-hidden="true">menu</span>
        </button>
    </div>

    <div class="header-end">
        <button type="button" class="profile-trigger" [matMenuTriggerFor]="profileMenu"
            [attr.aria-label]="'Profil: ' + profile.fullName">
            <span class="shell-avatar" aria-hidden="true">{{ profile.initials }}</span>
            <span class="profile-name">{{ profile.triggerLabel }}</span>
            <span class="material-symbols-outlined caret" aria-hidden="true">expand_more</span>
        </button>
        <mat-menu #profileMenu="matMenu" class="profile-menu-dropdown" xPosition="before">
            <div class="profile-card">
                <span class="shell-avatar" aria-hidden="true">{{ profile.initials }}</span>
                <div class="profile-card-text">
                    <span class="profile-card-name">{{ profile.fullName }}</span>
                    @if (profile.roleLine) {
                        <span class="profile-card-role">{{ profile.roleLine }}</span>
                    }
                </div>
            </div>
            <button mat-menu-item type="button" (click)="logout()">
                <mat-icon>logout</mat-icon>
                <span>Çıxış</span>
            </button>
        </mat-menu>
    </div>
</header>
