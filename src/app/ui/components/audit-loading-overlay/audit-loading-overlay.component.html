<div class="audit-loading-backdrop" aria-hidden="true"></div>

<div class="audit-loading-card">
    <div class="audit-loader-visual" aria-hidden="true">
        <span class="audit-loader-ring"></span>
        <span class="audit-loader-ring audit-loader-ring--delayed"></span>
        <span class="audit-loader-core"></span>
    </div>
    <p class="audit-loading-title">{{ title }}</p>
    <p class="audit-loading-hint">{{ hint }}</p>
    <span class="audit-sr-only">{{ effectiveAriaLabel }}</span>
</div>
