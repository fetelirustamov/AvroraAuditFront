<!-- backLink filtrli siyahı URL-idir (UrlTree): page-header-in tipi hələ yalnız string | massivdir -->
<app-page-header [title]="title" [subtitle]="subtitle" [backLink]="backLink" [backLabel]="backLabel">
    <div headerActions class="header-actions">
        @if (planInfo) {
            <app-status-chip [planStatus]="planInfo.status" />
        }
        @if (canDecide) {
            <button type="button" class="g-approve-btn" (click)="approve()" [disabled]="isSaving">
                <span class="material-symbols-outlined" aria-hidden="true">{{ approveAction.icon }}</span>
                {{ approveAction.label }}
            </button>
            <button type="button" class="g-secondary-btn" (click)="returnToMobile()" [disabled]="isSaving">
                <span class="material-symbols-outlined" aria-hidden="true">{{ returnAction.icon }}</span>
                {{ returnAction.label }}
            </button>
        }
    </div>
</app-page-header>

@if (planId == null) {
    <section class="table-card">
        <app-list-state state="empty" message="Yoxlama seçilməyib. Siyahıya qayıdıb yoxlamanı seçin" />
    </section>
} @else {
    <app-plan-info-section [planId]="planId" (planInfoLoaded)="onPlanInfoLoaded($event)" />

    <section class="table-card details-tabs">
        <mat-tab-group mat-stretch-tabs="false" animationDuration="0ms">
            <mat-tab label="Checklist">
                <div class="tab-body">
                    @if (sectionsError) {
                        <app-list-state state="error" [errorMessage]="sectionsError" (retry)="loadSections()" />
                    } @else if (!sectionsLoading && !sections.length) {
                        <app-list-state state="empty" message="Bu yoxlamada şöbə yoxdur" />
                    } @else {
                        @for (section of sections; track section.id) {
                            <app-inspection-section [plan]="planId" [section]="section"
                                [result]="sectionResults.get(section.headerId)" />
                        }
                    }
                </div>
            </mat-tab>
            <mat-tab label="Uyğunsuzluqlar">
                <div class="tab-body">
                    <app-diruption-section [data]="disruptionPlan" />
                </div>
            </mat-tab>
        </mat-tab-group>
    </section>
}
