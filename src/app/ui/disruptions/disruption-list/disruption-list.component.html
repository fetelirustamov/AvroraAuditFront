<div class="g-filter-card">
    <div class="g-filter-header">
        <span class="material-symbols-outlined">filter_list</span>
        <span>Filtrlər</span>
    </div>
    <form [formGroup]="inspectionsForm" (ngSubmit)="onFormSubmit()">
        <div class="g-filter-grid">
            <div class="g-filter-field">
                <label class="g-field-label">
                    <span class="material-symbols-outlined">business</span>
                    Müəssisə <span class="text-danger" aria-hidden="true">*</span>
                </label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <mat-select formControlName="firmId" required (selectionChange)="onSelectFirm($event.value)">
                        <mat-option *ngFor="let firm of firms" [value]="firm.id">{{ firm.name }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="g-filter-field">
                <label class="g-field-label">
                    <span class="material-symbols-outlined">location_on</span>
                    Lokasiya
                </label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <mat-select formControlName="locationCode">
                        <mat-option *ngFor="let location of locations" [value]="location.locationCode">{{ location.locationName }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="g-filter-field-wide">
                <label class="g-field-label">
                    <span class="material-symbols-outlined">date_range</span>
                    Tarix aralığı
                </label>
                <mat-form-field appearance="outline" class="g-modern-field" formGroupName="dateRange">
                    <mat-date-range-input [rangePicker]="picker">
                        <input matStartDate formControlName="start" placeholder="Başlanğıc">
                        <input matEndDate formControlName="end" placeholder="Son">
                    </mat-date-range-input>
                    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                    <mat-date-range-picker #picker></mat-date-range-picker>
                </mat-form-field>
            </div>
            <div class="g-filter-field">
                <label class="g-field-label">
                    <span class="material-symbols-outlined">info</span>
                    Status
                </label>
                <mat-form-field appearance="outline" class="g-modern-field">
                    <mat-select formControlName="status">
                        <mat-option *ngFor="let status of statusOptions" [value]="status.value">{{ status.label }}</mat-option>
                    </mat-select>
                </mat-form-field>
            </div>
            <div class="g-filter-actions">
                <button type="submit" class="g-search-btn">
                    <span class="material-symbols-outlined">search</span>
                    Axtar
                </button>
            </div>
        </div>
    </form>
</div>
<mat-card class="mb-25 border-radius d-block bg-white border-0 shadow-none">
    <mat-card-content class="audit-table-loading-shell">
        <div class="table-responsive" [class.audit-table-muted]="isLoading">
            <table mat-table [dataSource]="dataSource">

                <ng-container matColumnDef="position">
                    <th mat-header-cell *matHeaderCellDef>#</th>
                    <td mat-cell *matCellDef="let element; let i = index">
                        {{ getRowNumber(i) }}
                    </td>
                </ng-container>

                <!-- Agent Name Column -->
                <ng-container matColumnDef="inspectorName">
                    <th mat-header-cell *matHeaderCellDef class="text-center">
                        Müfəttiş
                    </th>
                    <td mat-cell *matCellDef="let element" class="text-center">

                        {{element.inspectorName}}
                    </td>
                </ng-container>

                <!-- Total Tickets Column -->
                <ng-container matColumnDef="locationCode">
                    <th mat-header-cell *matHeaderCellDef class="text-center">
                        Ərazi Kodu
                    </th>
                    <td mat-cell *matCellDef="let element" class="text-center">
                        {{element.locationCode}}
                    </td>
                </ng-container>

                <!-- Resolved Tickets Column -->
                <ng-container matColumnDef="locationName">
                    <th mat-header-cell *matHeaderCellDef class="text-center">
                        Ərazi
                    </th>
                    <td mat-cell *matCellDef="let element" class="text-center">
                        {{element.locationName}}
                    </td>
                </ng-container>

                <!-- Avg. Resolution Time Column -->
                <ng-container matColumnDef="createdDate">
                    <th mat-header-cell *matHeaderCellDef class="text-center">
                        Tarix
                    </th>
                    <td mat-cell *matCellDef="let element" class="text-center">
                        {{element.createdDate | date: 'yyyy-MM-dd'}}
                    </td>
                </ng-container>

                <!-- Action Column -->
                <ng-container matColumnDef="details">
                    <th mat-header-cell *matHeaderCellDef class="text-center">
                        Detallar
                    </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-flat-button
                            class="d-flex align-items-center btn-xs justify-content-center text-center"
                            style="gap: 6px;" (click)="onDetails(element)">
                            <span class="material-symbols-outlined"
                                style="font-size: 20px; margin-right: 5px;">visibility</span>
                            <span>Detallar</span>
                        </button>
                    </td>
                </ng-container>



                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            </table>
        </div>
        <mat-paginator [length]="allDataCount" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
            showFirstLastButtons [disabled]="isLoading"></mat-paginator>

        <app-audit-loading-overlay *ngIf="isLoading"></app-audit-loading-overlay>

    </mat-card-content>

</mat-card>
