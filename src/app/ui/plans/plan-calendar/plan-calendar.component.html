<!-- ─── Custom Page Header ─── -->
<div class="cal-header mb-25">
    <div class="cal-header-left">
        <div class="cal-nav-group">
            <button class="cal-nav-btn" (click)="goPrev()" title="Əvvəlki">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>
            <span class="cal-title">{{ currentTitle }}</span>
            <button class="cal-nav-btn" (click)="goNext()" title="Növbəti">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>
        <button class="cal-today-pill" (click)="goToday()">Bu gün</button>
    </div>

    <div class="cal-header-right">
        <div class="cal-view-switcher">
            <button class="cal-view-btn"
                [class.active]="currentView === 'dayGridMonth'"
                (click)="changeCalView('dayGridMonth')">
                <span class="material-symbols-outlined">calendar_month</span>
                Ay
            </button>
            <button class="cal-view-btn"
                [class.active]="currentView === 'dayGridWeek'"
                (click)="changeCalView('dayGridWeek')">
                <span class="material-symbols-outlined">calendar_view_week</span>
                Həftə
            </button>
            <button class="cal-view-btn"
                [class.active]="currentView === 'listMonth'"
                (click)="changeCalView('listMonth')">
                <span class="material-symbols-outlined">view_agenda</span>
                Siyahı
            </button>
        </div>
    </div>
</div>

<!-- ─── Two-Column Body ─── -->
<div class="cal-body">

    <!-- Sidebar -->
    <aside class="cal-sidebar">

        <!-- Filter Card -->
        <div class="cal-card">
            <div class="cal-card-header">
                <span class="material-symbols-outlined">tune</span>
                Filtrlər
            </div>
            <form [formGroup]="calendarForm" (ngSubmit)="onSearch()" class="cal-form">
                <div class="cal-field">
                    <label class="cal-label">Müəssisə</label>
                    <mat-form-field appearance="outline" class="cal-mf">
                        <mat-select formControlName="firmId" placeholder="Seçin">
                            <mat-option *ngFor="let firm of firms" [value]="firm.id">
                                {{ firm.name }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <div class="cal-field">
                    <label class="cal-label">Status</label>
                    <mat-form-field appearance="outline" class="cal-mf">
                        <mat-select formControlName="status" placeholder="Seçin">
                            <mat-option *ngFor="let s of statusOptions" [value]="s.value">
                                {{ s.label }}
                            </mat-option>
                        </mat-select>
                    </mat-form-field>
                </div>
                <button type="submit" class="cal-submit-btn">
                    <span class="material-symbols-outlined">search</span>
                    Axtar
                </button>
            </form>
        </div>

        <!-- Stats Card -->
        <div class="cal-card cal-stats-card">
            <div class="cal-card-header">
                <span class="material-symbols-outlined">bar_chart</span>
                Statistika
            </div>
            <div class="cal-stat-row">
                <div class="cal-stat">
                    <span class="cal-stat-value">{{ totalEvents }}</span>
                    <span class="cal-stat-label">Yüklənmiş plan</span>
                </div>
            </div>
        </div>

        <!-- Legend Card -->
        <div class="cal-card">
            <div class="cal-card-header">
                <span class="material-symbols-outlined">lens</span>
                Status Açıqlaması
            </div>
            <div class="cal-legend">
                <div class="cal-legend-item" (click)="filterByStatus(1)" title="Bu statusu filtrle">
                    <span class="cal-dot" style="background: #F59E0B;"></span>
                    <div class="cal-legend-info">
                        <span class="cal-legend-label">Gözləyir</span>
                        <span class="cal-legend-hint">Klikləyin</span>
                    </div>
                </div>
                <div class="cal-legend-item" (click)="filterByStatus(2)" title="Bu statusu filtrle">
                    <span class="cal-dot" style="background: #10B981;"></span>
                    <div class="cal-legend-info">
                        <span class="cal-legend-label">Təsdiqlənmiş</span>
                        <span class="cal-legend-hint">Klikləyin</span>
                    </div>
                </div>
                <div class="cal-legend-item" (click)="filterByStatus(-1)" title="Bu statusu filtrle">
                    <span class="cal-dot" style="background: #EF4444;"></span>
                    <div class="cal-legend-info">
                        <span class="cal-legend-label">Rədd edilmiş</span>
                        <span class="cal-legend-hint">Klikləyin</span>
                    </div>
                </div>
            </div>
        </div>

    </aside>

    <!-- Main Calendar -->
    <main class="cal-main audit-table-loading-shell">
        <app-audit-loading-overlay *ngIf="isLoading"
            title="Təqvim yüklənir"
            hint="Planlar hazırlanır — bir neçə saniyə çəkə bilər"
            ariaLabel="Plan təqvimi yüklənir"></app-audit-loading-overlay>
        <div class="cal-canvas" [class.audit-table-muted]="isLoading" [class.dark-theme]="themeService.isDark()">
            <full-calendar #calendar [options]="calendarOptions"></full-calendar>
        </div>
    </main>

</div>
