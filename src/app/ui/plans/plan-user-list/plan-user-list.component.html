<div class="g-filter-card">
    <div class="g-filter-header">
        <span class="material-symbols-outlined">filter_list</span>
        <span>Filtrlər</span>
    </div>
    <div class="g-filter-grid">
        <div class="g-filter-field">
            <label class="g-field-label">
                <span class="material-symbols-outlined">business</span>
                Müəssisə
            </label>
            <mat-form-field appearance="outline" class="g-modern-field">
                <mat-select (selectionChange)="onSelectFirm($event.value)">
                    <mat-option *ngFor="let firm of firms" [value]="firm.id">
                        {{ firm.name }}
                    </mat-option>
                </mat-select>
            </mat-form-field>
        </div>
        <div class="g-filter-actions">
            <button class="g-search-btn" (click)="onPlanClick()">
                <span class="material-symbols-outlined">event_available</span>
                Planla
            </button>
        </div>
    </div>
</div>


<mat-card class="dt-recent-leads-card mb-25 border-radius d-block bg-white border-0 shadow-none"
    [class.component-rtl-enabled]="themeService.isRTLEnabled()">
    <mat-card-content>
        <div class="table-style-two">
            <div class="table-responsive">
                <table mat-table [dataSource]="dataSource">

                    <!-- Checkbox Column -->
                    <ng-container matColumnDef="select">
                        <th mat-header-cell *matHeaderCellDef>
                            <mat-checkbox (change)="$event ? toggleAllRows() : null"
                                [checked]="selection.hasValue() && isAllSelected()"
                                [indeterminate]="selection.hasValue() && !isAllSelected()"
                                [aria-label]="checkboxLabel()">
                            </mat-checkbox>
                        </th>
                        <td mat-cell *matCellDef="let row">
                            <mat-checkbox (click)="$event.stopPropagation()"
                                (change)="$event ? selection.toggle(row) : null" [checked]="selection.isSelected(row)"
                                [aria-label]="checkboxLabel(row)">
                            </mat-checkbox>
                        </td>
                    </ng-container>

                    <!-- Customer Column -->
                    <ng-container matColumnDef="customer">
                        <th mat-header-cell *matHeaderCellDef>
                            Müfəttiş
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="customer-info d-flex align-items-center">

                                <span class="d-block text-black fw-medium">
                                    {{element.customer.name}}
                                </span>
                            </div>
                        </td>
                    </ng-container>

                    <!-- Email Column -->
                    <ng-container matColumnDef="email">
                        <th mat-header-cell *matHeaderCellDef>
                            Email
                        </th>
                        <td mat-cell *matCellDef="let element">

                            {{element.email}}
                        </td>
                    </ng-container>

                    <ng-container matColumnDef="planned">
                        <th mat-header-cell *matHeaderCellDef>
                            <div class="customer-info d-flex align-items-center">

                                <span class="d-block text-black fw-medium">
                                    Planlanmış
                                </span>
                            </div>
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="customer-info d-flex align-items-center">

                                <span class="d-block text-black fw-medium">
                                    {{element.planned}}
                                </span>
                            </div>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="confirmed">
                        <th mat-header-cell *matHeaderCellDef>
                            Təstiqlənmiş
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="customer-info d-flex align-items-center">
                                <span class="d-block text-black fw-medium">
                                    {{element.confirmed}}
                                </span>
                            </div>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="expired">
                        <th mat-header-cell *matHeaderCellDef>
                            Vaxtı bitmiş
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="customer-info d-flex align-items-center">
                                <span class="d-block text-black fw-medium">
                                    {{element.expired}}
                                </span>
                            </div>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="finished">
                        <th mat-header-cell *matHeaderCellDef>
                            Yekunlaşmış
                        </th>
                        <td mat-cell *matCellDef="let element">
                            <div class="customer-info d-flex align-items-center">
                                <span class="d-block text-black fw-medium">
                                    {{element.finished}}
                                </span>
                            </div>
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                </table>
            </div>
            <mat-paginator [pageSizeOptions]="pageSize" showFirstLastButtons></mat-paginator>
        </div>
    </mat-card-content>
</mat-card>
