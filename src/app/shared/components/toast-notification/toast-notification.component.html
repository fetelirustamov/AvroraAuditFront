<div class="toast" [class]="'is-' + data.type">
    <span class="toast-icon material-symbols-outlined" aria-hidden="true">{{ icon }}</span>

    <div class="toast-body">
        <p class="toast-title">{{ data.title }}</p>
        @if (data.message) {
            <p class="toast-message">{{ data.message }}</p>
        }
    </div>

    <button type="button" class="toast-close" aria-label="Bağla" (click)="dismiss()">
        <span class="material-symbols-outlined" aria-hidden="true">close</span>
    </button>

    @if (data.duration > 0) {
        <div class="toast-progress" aria-hidden="true">
            <div class="toast-progress-bar" [style.animation-duration.ms]="data.duration"></div>
        </div>
    }
</div>
